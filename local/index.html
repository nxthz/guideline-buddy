  if (!DATA) { bub.innerHTML = '<div class="happy" style="background:#F5F2F7;color:#6E6778">กำลังโหลดข้อมูล Guideline…</div>'; return 0; }
  if (!ME) { badge.hidden = true; bub.innerHTML = '<div class="head" style="--pc:#B51414"><span class="ava" style="--pc:#B51414">G</span><div><b>สวัสดีครับ ผมผู้ช่วย Guideline</b><small>คลิกขวาที่ผม แล้วเลือกคนที่จะให้ผมคอยบอกงาน</small></div></div><div class="foot"><span>ดับเบิลคลิกเพื่อเปิด Guideline</span><button data-a="menu">เลือกคน</button></div>'; return 0; }
  var p = meP(), list = tasksOf(ME), c = { late: 0, over: 0, due: 0, start: 0, soon: 0 };
  list.forEach(function (k) { c[k.st]++; });
  var urgent = c.late + c.over + c.due; badge.hidden = !urgent; badge.textContent = urgent;
  var tile = function (cls, n, label) { return '<div class="tile ' + cls + (n ? "" : " zero") + '"><b>' + n + "</b><small>" + label + "</small></div>"; };
  var now = list.filter(function (k) { return k.st !== "soon"; }), show = (now.length ? now : list).slice(0, 3);
  var who = ME === "*";
  bub.style.setProperty("--pc", p.color);
  bub.innerHTML = '<div class="head">' + avaHtml(p) + "<div><b>" + esc(p.nick) + "</b><small>" + esc(p.role || (p.dept === "graphic" ? "ทีมกราฟฟิก" : "ทีมตัดต่อ")) + " · " + esc(dLabel(dStr(new Date()))) + "</small></div></div>" +
    '<div class="tiles">' + tile("late", c.late + c.over, "เลยกำหนด") + tile("due", c.due, "เสร็จวันนี้") + tile("start", c.start, "ควรเริ่ม") + tile("soon", c.soon, "รอคิว") + "</div>" +
    (list.length ? '<ul class="list">' + show.map(function (k) {
      var right = k.st === "start" || k.st === "soon" ? "<b>" + esc(dLabel(k.due)) + "</b>ส่งงาน" : "<b>" + esc(dLabel(k.post)) + "</b>วันลง";
      var owner = who ? " · " + esc((k.b.owners || []).map(function (n) { return person(n).nick; }).join(", ")) : "";
      return '<li class="row"><span class="bar" style="background:' + COL[k.st] + '"></span><span class="t"><b><i class="kind k-' + k.k + '">' + k.kind + "</i>" + esc(k.b.name) + "</b><small>" + NOTE[k.st] + owner + "</small></span><span class=\"d\">" + right + "</span></li>";
    }).join("") + "</ul>" : '<div class="happy">ไม่มีงานค้างเลย เก่งมาก!</div>') +
    '<div class="foot"><span>' + (list.length > show.length ? "อีก " + (list.length - show.length) + " งาน" : "อัปเดตทุก 10 นาที") + '</span><button data-a="open">เปิด Guideline</button></div>';
  return urgent;
}
function renderMenu() {
  var m = document.getElementById("menu"), ppl = (DATA && DATA.people) || [];
  var grp = function (dept, title, extra) { var arr = ppl.filter(function (p) { return p.dept === dept; }); return arr.length || extra ? '<div class="sec">' + title + '</div><div class="ppl">' + arr.map(function (p) { return '<button class="pp' + (ME === p.name ? " on" : "") + '" style="--pc:' + p.color + '" data-p="' + esc(p.name) + '" title="' + esc(p.nick) + '">' + avaHtml(p) + "<span>" + esc(p.nick) + "</span></button>"; }).join("") + (extra || "") + "</div>" : ""; };
  m.style.setProperty("--pc", "#B51414");
  var team = '<button class="pp' + (ME === "*" ? " on" : "") + '" style="--pc:#B51414" data-p="*"><span class="ava" style="--pc:#B51414;font-size:11px">ทีม</span><span>ทั้งทีม</span></button>';
  m.innerHTML = '<div class="head"><span class="ava" style="--pc:#B51414">🐾</span><div><b>ให้น้องบอกงานของใคร?</b><small>เลือก 1 คน หรือดูทั้งทีม</small></div><button class="iconx x" data-a="close" aria-label="ปิด">' + ICON.x + "</button></div>" +
    '<div class="mbody">' + grp("video", "ทีมตัดต่อ") + grp("graphic", "ทีมกราฟฟิก", team) +
    '<div class="sec">ตัวละคร</div><div class="chars">' + allChars().map(function (c) { return '<button class="ch' + (c.id === CHAR ? " on" : "") + '" data-char="' + c.id + '" title="' + esc(c.name) + '"><img src="' + c.src + '" alt="">' + (c.custom ? '<span class="del" data-chardel="' + c.id + '" title="ลบรูปนี้">×</span>' : "") + "</button>"; }).join("") +
    '<button class="ch add" data-a="addchar" title="ใส่รูปของคุณเอง">+</button><input type="file" id="charfile" accept="image/png,image/jpeg,image/webp,image/gif" hidden></div><div class="chnote">กด + เพื่อใส่รูปเอง รูปพื้นเรียบ (เช่น พื้นขาว) จะถูกตัดพื้นหลังให้อัตโนมัติ</div>' +
    '<div class="acts"' + (SHELL ? "" : ' style="grid-template-columns:1fr 1fr"') + '><button class="act ic" data-a="open">' + ICON.open + 'เปิด Guideline</button><button class="act ic" data-a="sync">' + ICON.sync + 'อัปเดตข้อมูล</button>' + (SHELL ? '<button class="act ic" data-a="home">' + ICON.home + "กลับมุมจอ</button>" : "") +
    '<div class="size"><span>ขนาดน้อง<small>หมุนล้อเมาส์บนตัวน้องก็ได้</small></span><button data-a="smaller" aria-label="เล็กลง">−</button><b id="szv">' + Math.round(SC * 100) + '%</b><button data-a="bigger" aria-label="ใหญ่ขึ้น">+</button></div>' +
    (SHELL ? '<button class="act tog wide' + (LOGIN ? " on" : "") + '" data-a="boot">' + ICON.boot + 'เปิดพร้อมเครื่องทุกครั้ง<span class="sw"></span></button>' : "") + "</div>" +
    (SHELL ? '<div class="mfoot"><button data-a="quit">' + ICON.power + "ปิดผู้ช่วย</button></div>" :
      '<div class="acts" style="grid-template-columns:1fr;border-top:0;margin-top:0;padding-top:0"><button class="act wide" data-buddy-install style="justify-content:center;background:#1E1A24;color:#fff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span data-label>ติดตั้งน้องลงคอม (นั่งบนจอนอกเว็บ)</span></button></div>' +
      '<div class="mfoot" style="color:var(--muted);font-size:11.5px;padding:0 16px 12px;text-align:center">ปิดน้องได้ที่ปุ่ม × ของหน้าต่างนี้</div>') + "</div>";
}
var lastUrgent = -1;
function setData(d) { DATA = d; var u = renderBubble(); if (B && B.setPeople) B.setPeople((DATA.people || []).map(function (p) { return { name: p.name, nick: p.nick, dept: p.dept }; })); if (B && B.setBadge) B.setBadge(u || 0, ME ? meP().nick : ""); if (lastUrgent >= 0 && u > lastUrgent) play("wiggle", 1200); lastUrgent = u || 0; }
function load() { var p = B ? B.getData() : fetch("../buddy.json", { cache: "no-store" }).then(function (r) { return r.json(); }); return p.then(setData).catch(function () { renderBubble(); }); }
// ---- showing / hiding the cards
var wrap = document.getElementById("dogwrap"), bubble = document.getElementById("bubble"), menuEl = document.getElementById("menu"), tail = document.getElementById("tail");
function play(cls, ms) { wrap.classList.remove("jump", "wiggle"); void wrap.offsetWidth; wrap.classList.add(cls); setTimeout(function () { wrap.classList.remove(cls); }, ms); }
function open(which) { clearTimeout(hideT); (which === "menu" ? bubble : menuEl).classList.remove("on"); if (which === "menu") renderMenu(); else renderBubble(); (which === "menu" ? menuEl : bubble).classList.add("on"); tail.classList.add("on"); }
function closeAll() { bubble.classList.remove("on"); menuEl.classList.remove("on"); tail.classList.remove("on"); if (B) B.setInteractive(false); }
function hideSoon() { clearTimeout(hideT); if (menuEl.classList.contains("on")) return; hideT = setTimeout(closeAll, 1400); }
// only the dog and an open card catch the mouse; the rest of the window lets clicks through to the desktop
document.addEventListener("mousemove", function (e) {
  var el = document.elementFromPoint(e.clientX, e.clientY), hit = !!(el && (el.closest("#dogwrap") || el.closest(".card.on")));
  if (B) B.setInteractive(hit);
});
wrap.addEventListener("mouseenter", function () { if (busy) return; if (!wrap.classList.contains("jump")) play("jump", 760); if (!menuEl.classList.contains("on")) open("bubble"); });
wrap.addEventListener("mouseleave", hideSoon);
[bubble, menuEl].forEach(function (c) { c.addEventListener("mouseenter", function () { clearTimeout(hideT); }); c.addEventListener("mouseleave", hideSoon); });
document.addEventListener("click", function (e) {
  var del = e.target.closest("[data-chardel]");
  if (del) { e.stopPropagation(); MINE = MINE.filter(function (c) { return c.id !== del.dataset.chardel; }); if (CHAR === del.dataset.chardel) CHAR = "dog"; saveChars(); applyChar(); renderMenu(); return; }
  var ch = e.target.closest("[data-char]");
  if (ch) { CHAR = ch.dataset.char; saveChars(); applyChar(); renderMenu(); play("jump", 760); return; }
  var p = e.target.closest("[data-p]"), a = e.target.closest("[data-a]");
  if (a && a.dataset.a === "addchar") { document.getElementById("charfile").click(); return; }
  if (p) { ME = p.dataset.p; cmd("setPerson", ME); if (!B || !B.cmd) localStorage.setItem("buddy-person", ME); setData(DATA || { people: [], brands: [] }); play("jump", 760); open("bubble"); hideSoon(); return; }
  if (!a) return;
  var act = a.dataset.a;
  if (act === "menu") return open("menu");
  if (act === "close") return closeAll();
  if (act === "open") { if (B) B.openHub(); else window.open(new URL("../", location.href).href, "_blank"); return; }
  if (act === "sync") { load().then(function () { play("jump", 760); open("bubble"); hideSoon(); }); return; }
  if (act === "home") { cmd("home"); closeAll(); return; }
  if (act === "boot") { LOGIN = !LOGIN; a.classList.toggle("on", LOGIN); cmd("setLogin", LOGIN); return; }
  if (act === "quit") { cmd("quit"); return; }
  if (act === "smaller" || act === "bigger") { setSize(SC + (act === "bigger" ? 0.1 : -0.1)); return; }
});
// drag to move (main process moves the window); a click without dragging = happy jump
var drag = null;
wrap.addEventListener("mousedown", function (e) { if (e.button !== 0) return; drag = { x: e.screenX, y: e.screenY, moved: false }; wrap.style.cursor = "grabbing"; });
window.addEventListener("mousemove", function (e) { if (!drag || !B) return; var dx = e.screenX - drag.x, dy = e.screenY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true; if (drag.moved) { B.moveBy(dx, dy); drag.x = e.screenX; drag.y = e.screenY; } });
window.addEventListener("mouseup", function () { if (drag && !drag.moved) play("jump", 760); drag = null; wrap.style.cursor = ""; });
wrap.addEventListener("dblclick", function () { if (B) B.openHub(); else window.open(new URL("../", location.href).href, "_blank"); });
wrap.addEventListener("contextmenu", function (e) { e.preventDefault(); if (B && !B.cmd && B.showMenu) return B.showMenu(); open("menu"); }); // v1.0.0 shells fall back to the Windows menu
// every few minutes: run (hop) to another spot along the bottom of the screen
function runSomewhere() {
  if (!B || busy || drag || bubble.classList.contains("on") || menuEl.classList.contains("on")) return schedule();
  B.getBounds().then(function (r) {
    var minX = r.area.x, maxX = r.area.x + r.area.width - r.win.width, tx = Math.round(minX + Math.random() * (maxX - minX));
    if (Math.abs(tx - r.win.x) < 120) return schedule();
    busy = true; wrap.classList.toggle("flip", tx > r.win.x); wrap.classList.add("run");
    var x = r.win.x, dir = tx > x ? 1 : -1, last = performance.now();
    (function step(now) {
      var dt = Math.min(50, now - last); last = now; x += dir * dt * 0.28;
      if ((dir > 0 && x >= tx) || (dir < 0 && x <= tx)) { B.moveTo(tx); wrap.classList.remove("run"); busy = false; play("jump", 760); return schedule(); }
      B.moveTo(Math.round(x)); requestAnimationFrame(step);
    })(last);
  });
}
function schedule() { setTimeout(runSomewhere, (3 + Math.random() * 4) * 60e3); }
document.addEventListener("change", function (e) {
  if (e.target.id !== "charfile" || !e.target.files || !e.target.files[0]) return;
  prepPicture(e.target.files[0]).then(function (src) {
    var id = "c" + Date.now().toString(36); MINE.unshift({ id: id, src: src }); MINE = MINE.slice(0, 6); var prev = CHAR; CHAR = id;
    if (!saveChars()) { MINE.shift(); CHAR = prev; saveChars(); } applyChar(); renderMenu(); play("jump", 760);
  }).catch(function (er) { alert(er.message || "ใส่รูปไม่ได้"); });
});
wrap.addEventListener("wheel", function (e) { e.preventDefault(); setSize(SC + (e.deltaY < 0 ? 0.1 : -0.1)); }, { passive: false });
setSize(SC); applyChar();
if (!B) document.body.style.background = "linear-gradient(160deg, #FBF7F0, #EFE8F4)"; // opened as a normal window (no desktop shell): give it a soft backdrop
// boot
(B ? B.getPerson() : Promise.resolve(localStorage.getItem("buddy-person") || "")).then(function (n) { ME = n || ""; load(); schedule(); });
cmd("getLogin").then(function (v) { LOGIN = !!v; });
if (B && B.onPerson) B.onPerson(function (n) { ME = n; setData(DATA || { people: [], brands: [] }); play("jump", 760); open("bubble"); hideSoon(); });
setInterval(load, 10 * 60e3);
// live updates: when a new version of Guideline is deployed, reload this page (person, character and size are kept)
(function () {
  var cur = null;
  function check() {
    fetch(new URL("../version.json", location.href).href + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      if (!j || !j.v) return; if (cur === null) { cur = j.v; return; }
      if (j.v !== cur && !drag && !busy && !menuEl.classList.contains("on")) location.reload();
    }).catch(function () {});
  }
  check(); setInterval(check, 60e3);
})();
setTimeout(function () { play("jump", 760); }, 800);
</script>
